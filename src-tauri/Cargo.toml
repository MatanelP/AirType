[package]
name = "airtype"
version = "1.3.2"
description = "AirType - Voice to Text Desktop App"
authors = ["MatanelP"]
edition = "2021"

[lib]
name = "airtype_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri
tauri = { version = "2.10.3", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Audio capture
cpal = "0.15"

# Text injection
enigo = "0.2"

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client for model downloads
reqwest = { version = "0.12", features = ["stream", "json", "multipart"] }

# Base64 encoding for audio data
base64 = "0.22"

# Clipboard access for fast text injection
arboard = "3"

# Error handling
anyhow = "1"
thiserror = "1"

# Synchronization
parking_lot = "0.12"

# Logging
log = "0.4"
env_logger = "0.11"

# Directories for config/data storage
dirs = "5"

# Low-level keyboard event listening (for modifier-only hotkeys)
rdev = "0.5"

[target.'cfg(target_os = "linux")'.dependencies]
# Secure secret storage on Linux
keyring = { version = "3", features = ["sync-secret-service"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Secure secret storage on macOS
keyring = { version = "3", features = ["apple-native"] }
# Direct CGEvent posting for reliable Cmd+V paste (enigo's modifier-flag
# tracking with raw keycodes is unreliable and sometimes types a literal "v").
# Pinned to match the version enigo already pulls in.
core-graphics = "0.23"
# Objective-C runtime: used to call [NSApp activateIgnoringOtherApps:] so the
# main window reliably comes to the foreground from tray/dock activation.
objc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
# Secure secret storage on Windows
keyring = { version = "3", features = ["windows-native"] }

# URL encoding for data URLs
urlencoding = "2"

[dev-dependencies]
tempfile = "3"

# Vendored, patched rdev (0.5.3). Upstream's macOS listen loop calls Text Input
# Source APIs off the main thread to translate keycodes -> Event::name, which
# SIGTRAPs on modern macOS. Our fork skips that lookup (we never read the name).
# See vendor/rdev/src/macos/keyboard.rs.
[patch.crates-io]
rdev = { path = "vendor/rdev" }
