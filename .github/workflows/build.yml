name: Build & Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev \
            libssl-dev \
            libxdo-dev \
            libdbus-1-dev \
            pkg-config \
            build-essential \
            cmake

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        run: npx tauri build --bundles deb,rpm,appimage
        env:
          # Required for the self-updater: signs the updater artifacts and emits
          # the .sig files that latest.json references. Set these repo secrets
          # from the keypair (see README → Releasing & self-update).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AirType-linux-x86_64
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
          if-no-files-found: warn

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Disable native CPU detection for whisper.cpp
        run: |
          cat > $RUNNER_TEMP/no-native.cmake <<EOF
          set(GGML_NATIVE OFF CACHE BOOL "" FORCE)
          set(CMAKE_OSX_DEPLOYMENT_TARGET "11.0" CACHE STRING "" FORCE)
          EOF

      - name: Build Tauri app
        run: npx tauri build --bundles app,dmg
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CMAKE_TOOLCHAIN_FILE: ${{ runner.temp }}/no-native.cmake
          MACOSX_DEPLOYMENT_TARGET: '11.0'
          APPLE_SIGNING_IDENTITY: '-'

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AirType-macos-aarch64
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: warn

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        run: npx tauri build --bundles msi,nsis
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AirType-windows-x86_64
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
          if-no-files-found: warn

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate updater manifest (latest.json)
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"

          platforms="{}"
          add_platform() {
            local key="$1" sig_file="$2"
            local art_base sig
            art_base="$(basename "${sig_file%.sig}")"
            sig="$(cat "$sig_file")"
            platforms="$(jq -n --argjson p "$platforms" --arg k "$key" --arg s "$sig" --arg u "${BASE}/${art_base}" \
              '$p + {($k): {signature: $s, url: $u}}')"
            echo "  + $key -> $art_base"
          }

          # Map each signed updater artifact to its Tauri updater target triple.
          while IFS= read -r f; do add_platform "linux-x86_64"   "$f"; done < <(find artifacts -name '*.AppImage.sig')
          while IFS= read -r f; do add_platform "darwin-aarch64" "$f"; done < <(find artifacts -name '*.app.tar.gz.sig')
          while IFS= read -r f; do add_platform "windows-x86_64" "$f"; done < <(find artifacts -name '*-setup.exe.sig')

          if [ "$(jq 'length' <<<"$platforms")" -eq 0 ]; then
            echo "::error::No signed updater artifacts (*.sig) found — is TAURI_SIGNING_PRIVATE_KEY set?"
            exit 1
          fi

          jq -n --arg v "$VERSION" --arg d "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --argjson p "$platforms" \
            '{version: $v, pub_date: $d, platforms: $p}' > artifacts/latest.json

          echo "Generated latest.json:"; cat artifacts/latest.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: artifacts/**/*
