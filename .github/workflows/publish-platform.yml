name: Publish completed platform

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      artifact-name:
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # ONE lock across tags/platforms/retries. Queue all waiting publishers;
    # the default one-pending-job behavior would cancel an earlier platform.
    concurrency:
      group: airtype-release-publication
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download this run and commit's completed platform
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: artifacts
      - name: Publish packages and extend the shared updater manifest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PLATFORM: ${{ inputs.platform }}
        run: >-
          node scripts/publish-platform-release.mjs
          --repo "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME"
          --platform "$RELEASE_PLATFORM" --artifacts artifacts
